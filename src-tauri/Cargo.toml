[package]
name = "soundbox-desktop"
version = "0.4.0"
description = "Local sound effects, music and speech from open-weight models"
authors = ["Soundbox contributors"]
license = "MIT"
repository = "https://github.com/HamSanders/soundbox"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri's mobile targets require a cdylib; keeping the lib/main split now means
# adding a platform later doesn't mean restructuring the crate.
name = "soundbox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Job objects, so the backend cannot outlive this process even if we are
# force-killed or crash — a graceful-shutdown handler alone cannot cover that,
# and an orphaned backend silently keeps the GPU and the port.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
