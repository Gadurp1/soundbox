name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release PRs are pushed by a workflow, which starts no CI on its own;
  # release-prepare.yml dispatches this instead.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      # Every file that records the version agrees (scripts/version.mjs).
      - run: node scripts/version.mjs check
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # One lockfile at the root: npm workspaces install app, server and site
      # together, hoisted.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Node 24 also writes report files (server/vitest.config.ts); the next
      # two steps publish them even when a test fails.
      - run: npm test
        env:
          SOUNDBOX_TEST_REPORT: ${{ matrix.node == 24 && '1' || '' }}
      - name: Test summary
        if: ${{ !cancelled() && matrix.node == 24 }}
        run: node scripts/test-summary.mjs server/test-results/results.json "Server tests (Node 24)"
      - name: Upload test report
        if: ${{ !cancelled() && matrix.node == 24 }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            server/test-results/junit.xml
            server/test-results/html/
          if-no-files-found: warn
          retention-days: 30
      # Builds the app, stages app/dist into server/web, then builds the server.
      - run: npm run build
      - run: npm run site:build

  desktop:
    name: Desktop shell (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri.conf.json's frontendDist is src-tauri/splash, which is checked
      # in, so this needs no `npm run build` first.
      - run: cargo check --manifest-path src-tauri/Cargo.toml
