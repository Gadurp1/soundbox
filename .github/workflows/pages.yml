name: Pages

# Publishes the marketing/docs site (site/) to GitHub Pages as a project site,
# served at https://hamsanders.github.io/soundbox/. SITE_BASE sets Vite's `base`
# and the router's basename; SITE_ORIGIN is the origin canonical, og:url and
# RSS links are built from. See site/vite.config.ts.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "app/src/**"
      - "docs/**"
      - "README.md"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one, but a run
# already deploying is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the site
        run: npm run site:build
        env:
          SITE_BASE: /soundbox/
          SITE_ORIGIN: https://hamsanders.github.io
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
