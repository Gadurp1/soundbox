version: 2
updates:
  # One root lockfile covers every workspace (app, server, site).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # OpenTelemetry's api, sdk and exporters only work at matching
      # versions, so they move together and never mixed into the group below.
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
